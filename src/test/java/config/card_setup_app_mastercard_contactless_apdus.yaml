# Mastercard contactless (EMV Contactless Book C-2, Kernel 2) profile: CDA, Relay Resistance Protocol and enciphered offline PIN.
# Applied after card_setup_app_apdus.yaml, only the differing data objects are set here.
- req: '00 A4 04 00 07 AF FF FF FF FF 12 34'
  res: '90 00'
# Relay Resistance Protocol timing (EMV Contactless Book C-2, 3.10 and 5.3), in units of hundreds of microseconds:
# Min Time For Processing Relay Resistance APDU (2) || Max Time For Processing Relay Resistance APDU (2) ||
# Device Estimated Transmission Time For Relay Resistance R-APDU (2): min 0.0 ms, max 20.0 ms, transmission 1.8 ms.
# Relay resistance data of the latest exchange is included in the CDA signature (C-2, Table 6.8).
- req: '80 00 00 0A 06 00 00 00 C8 00 12'
  res: '90 00'
# Application Interchange Profile: cardholder verification, terminal risk management and CDA supported (byte 1),
# EMV mode and Relay Resistance Protocol supported (byte 2, EMV Contactless Book C-2, A.1.16)
- req: '80 01 00 82 02 19 81'
  res: '90 00'
# CVM List: enciphered PIN verified by ICC if the terminal supports it (apply succeeding CVM Rule if unsuccessful),
# otherwise No CVM required
- req: '80 01 00 8E 0C 00 00 00 00 00 00 00 00 44 03 1F 03'
  res: '90 00'
# ICC Public Key Certificate signed with iin_313233343536_e_3_private_key.pem, static data to be authenticated
# includes the Application Interchange Profile (Static Data Authentication Tag List 9F4A) and the CVM List
