plugins {
    id 'java-library'
}

// Library packaging of the simulator applets (../src/main/java, unmodified) with a host-side API.
// Targets Java 8 so it can be used on the JVM and Android, independently of the JavaCard targeting of the root project.
group = 'emvcardsimulator'
version = '0.1'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

dependencies {
    api 'com.klinec:jcardsim:latest.release'

    // JUnit 6 requires Java 17
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.+'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.+'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.+'
}

sourceSets {
    main {
        java {
            srcDirs = ['../src/main/java', 'src/main/java']
        }
        resources {
            srcDirs = []
        }
    }
}

processResources {
    from('../src/main/rust/config') {
        include '*.yaml'
        exclude 'log4rs.yaml'
        into 'emvcardsimulator/scripts'
    }
    from('../src/test/java/config') {
        include '*.yaml'
        exclude 'log4rs.yaml', 'settings.yaml', 'scheme_ca_public_keys_test.yaml'
        into 'emvcardsimulator/scripts/test'
    }
}

test {
    useJUnitPlatform()
}
