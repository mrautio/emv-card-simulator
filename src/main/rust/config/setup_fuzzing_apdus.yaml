# Select PSE AID
- req: '00 A4 04 00 0E 31 50 41 59 2E 53 59 53 2E 44 44 46 30 31'
  res: '90 00'

# clear fuzzing
- req: '80 07 00 00 00'
  res: '90 00'

- req: '80 03 01 0C 30 61 2F 4F 08 AF FF 00 00 03 10 10 01 50 0D 56 41 53 41 20 45 4C 45 43 54 52 41 4E 9F 12 10 56 41 53 41 20 20 20 20 20 20 20 20 20 20 20 20 87 01 FF'
  res: '90 00'

# READ RECORD FALLBACK
- req: '80 00 00 06 02 01 0C'
  res: '90 00'

# Select paymentapp AID
- req: '00 A4 04 00 08 A0 00 00 00 03 10 10 01'
#- req: '00 A4 04 00 07 AF FF FF FF FF 12 34'
  res: '90 00'

# clear fuzzing
- req: '80 07 00 00 00'
  res: '90 00'

# READ RECORD FALLBACK
- req: '80 00 00 06 02 01 0C'
  res: '90 00'

# Faults: '80 11' || table entry (0 - 7) || '00' || Lc || kind || INS ('00' any) || interface ('00' both) || trigger mode || n || data
# Kind '01' mutates the tag value: tag || offset || length || strategy ('00' random) || argument

# Random 0x40 bytes to tags 9F10 and 9F36 in every response
- req: '80 11 00 00 0B 01 00 00 00 00 9F 10 00 40 00 00'
  res: '90 00'
- req: '80 11 01 00 0B 01 00 00 00 00 9F 36 00 40 00 00'
  res: '90 00'

# Random 0x40 bytes to response templates 80 and 77
- req: '80 01 00 80 01 00'
  res: '90 00'
- req: '80 11 02 00 0A 01 00 00 00 00 80 00 40 00 00'
  res: '90 00'
- req: '80 01 00 77 01 00'
  res: '90 00'
- req: '80 11 03 00 0A 01 00 00 00 00 77 00 40 00 00'
  res: '90 00'

