buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    id 'java'
    id 'checkstyle'
    id 'groovy'
}

apply plugin: 'java'

// JavaCard targets need Java 7 (or older) class files, which JDK 9+ javac cannot produce
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

// set default properties
// override in command line like: gradle deployPaymentApp -Pjc_version=2.2.2 -Ppaymentapp_cap_aid=A000000123456
if (!project.hasProperty("jc_version")) {
    ext.jc_version = "3.0.5"
}
if (!project.hasProperty("paymentapp_cap_aid")) {
    ext.paymentapp_cap_aid = "AFFFFFFFFF0000"
}
if (!project.hasProperty("paymentapp_applet_aid")) {
    ext.paymentapp_applet_aid = "AFFFFFFFFF1234"
}

// gp.jar releases of GlobalPlatformPro that the deployment is known to work with
ext.gp_checksums = [
    "20.07.04": "4030c6eb46fb932c167f9a53fdbfab6b1364dbaafad5068b5bfc9779140cc1659e655d5ff53ee20d2823163011ede3ec9c3916632c2173cb6a1e17b84389490a",
    "26.06.04": "70694381e9bb31d2a1c124dc2eda51be3c3276fe4124358294e9e1d132fe82c93a09295144626f24a1dd0e2443e9c4d354239211895d2f47af7ebca6b5861d25"
]

ext.gp_latest_version = "26.06.04"
// The last release that runs on Java 8
ext.gp_java8_version = "20.07.04"
// These JavaCard SDKs are used with Java 8, which newer gp.jar releases do not run on
ext.jc_versions_on_java8 = ["2.2.1", "2.2.2", "3.0.1", "3.0.4"]

if (!project.hasProperty("gp_version")) {
    ext.gp_version = jc_versions_on_java8.contains(jc_version) ? gp_java8_version : gp_latest_version
}
if (!gp_checksums.containsKey(gp_version) && !project.hasProperty("gp_checksum")) {
    throw new GradleException("gp.jar version not recognized: ${gp_version}."
        + " Give the expected SHA-512 of the release with -Pgp_checksum=<checksum>")
}
ext.gp_jar = "gp-${gp_version}.jar"

// 3.1.0 targeting does not work
/*if (jc_version == "3.1.0") {
    // class major version 51
    ext.java_version_compatible = 1.7
    ext.jc_sdk = "jc310b43_kit"
} else*/ if (jc_version == "3.0.5") {
    // class major version 51
    ext.java_version_compatible = 1.7
    ext.jc_sdk = "jc305u3_kit"
} else if (jc_version == "3.0.4") {
    // class major version 50
    ext.java_version_compatible = 1.6
    ext.jc_sdk = "jc304_kit"
} else if (jc_version == "3.0.1") {
    // class major version 50
    ext.java_version_compatible = 1.6
    ext.jc_sdk = "jc303_kit"
} else if (jc_version == "2.2.2") {
    // class major version 49
    ext.java_version_compatible = 1.5
    ext.jc_sdk = "jc222_kit"
} else if (jc_version == "2.2.1") {
    // class major version 46
    ext.java_version_compatible = 1.2
    ext.jc_sdk = "jc221_kit"
} else {
    throw new GradleException("JavaCard version not recognized: ${jc_version}")
}

// Nix-shell pure environment's gradle does not find cargo somehow
// working around via bash/cmd call
ext.cmd_shell = "bash"
ext.cmd_shell_option = "-c"
if (System.properties['os.name'].toLowerCase().contains('windows')) {
    ext.cmd_shell = "cmd"
    ext.cmd_shell_option = "/c"
}

task buildSimulatorLibrary(type: Exec) {
    group "Build"
    description "Build Rust simulator library"
    workingDir 'src/test/rust/simulator'

    commandLine "${cmd_shell}", "${cmd_shell_option}", 'cargo build'
}

tasks.withType(Test) {
    systemProperty "java.library.path", "../../rust/simulator/target/debug/"
}

checkstyle {
    // 9.3 is the last Checkstyle release that runs on Java 8
    toolVersion '9.3';
}

checkstyleMain {
    source ='src/main/java'
    maxWarnings = 0
}

checkstyleTest {
    source ='src/test/java'
    maxWarnings = 0
}

// Host side deployment tool, it runs on the computer and not on the card
sourceSets {
    deploy {
        java {
            srcDirs = ['src/deploy/java']
        }
    }
}

compileDeployJava {
    options.compilerArgs = [
            '-Xlint:all',
            '-Xlint:-options',
            '-Werror'
    ]
    // javax.smartcardio is used instead of the gp.jar card readers, see CardDeployer
    sourceCompatibility = 1.8
    targetCompatibility = 1.8
}

checkstyleDeploy {
    source ='src/deploy/java'
    maxWarnings = 0
}


repositories {
    mavenCentral()
}

configurations {
    javacardAntTask
}

dependencies {

    // JUnit 6 requires Java 17, stay on JUnit 5 while building on Java 8
    testRuntimeOnly (
        'org.junit.jupiter:junit-jupiter-engine:5.+',
        'org.junit.platform:junit-platform-launcher:1.+'
    )

    testImplementation (
        'org.junit.jupiter:junit-jupiter-api:5.+',
        'com.klinec:jcardsim:latest.release'
    )
    implementation (
        'com.klinec:jcardsim:latest.release'
    )
    javacardAntTask 'com.github.martinpaljak:ant-javacard:latest.release'
}

test {
    dependsOn buildSimulatorLibrary
    workingDir 'src/test/java/emvcardsimulator'

    useJUnitPlatform()

    // Private test cards are tested with testPrivateCards
    exclude '**/PrivateCardTest*'

    testLogging {
        outputs.upToDateWhen { false }
        events "started", "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams true
    }

    failFast = false
}

task testPrivateCards(type: Test) {
    dependsOn buildSimulatorLibrary
    group "Verification"
    description "Run transactions of the private test cards in private/cards against emvpt, -PprivateCards=<path part> selects cards"
    workingDir 'src/test/java/emvcardsimulator'
    systemProperty 'privateCards', project.findProperty('privateCards') ?: ''
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform()
    filter {
        includeTestsMatching 'emvcardsimulator.PrivateCardTest'
    }

    testLogging {
        outputs.upToDateWhen { false }
        events "passed", "skipped", "failed"
        exceptionFormat "short"
        showStandardStreams true
    }
}

compileJava {
    options.compilerArgs = [
            '-Xlint:all',
            '-Xlint:-options', //java 13 warns about Java 7 targetting
            '-Xlint:-deprecation', // Some Java Card features are deprecated in 3.0.5 but we target earlier versions
            '-Werror'
    ]

    sourceCompatibility = java_version_compatible
    targetCompatibility = java_version_compatible

    // in case need to target for very old Java class major version
    if (project.hasProperty("compile_javac_path")) {
        options.fork = true
        options.forkOptions.executable = "${compile_javac_path}"
    }
}

compileTestJava {
    options.compilerArgs = [
            '-Xlint:all',
            '-Xlint:-options', //java 13 warns about Java 7 targetting
            '-Werror'
    ]
    // JUnit 5 requires Java 8 or newer
    sourceCompatibility = 1.8
    targetCompatibility = 1.8
}

task downloadGp {
    group "JavaCard"
    description "Download the GlobalPlatformPro gp.jar, -Pgp_version selects the release"

    doLast {
        if (!new File(gp_jar).exists()) {
            String checksumExtension = '.sha512.tmp'
            String gpJarTemp = gp_jar + checksumExtension

            ant.get(src: "https://github.com/martinpaljak/GlobalPlatformPro/releases/download/v${gp_version}/gp.jar", dest:gp_jar)

            ant.checksum(file: gp_jar, algorithm:'SHA-512', fileext: checksumExtension)
            String expectedChecksum = project.findProperty('gp_checksum') ?: gp_checksums[gp_version]
            String actualChecksum = new File(gpJarTemp).text.trim()
            delete gpJarTemp

            if (!expectedChecksum.equals(actualChecksum)) {
                // Keeping the file would make the next run skip the download and use it unverified
                delete gp_jar
                throw new GradleException("Checksum not valid! file: " + gp_jar + ", expected: " + expectedChecksum + ", actual: " + actualChecksum)
            }
        }
    }
}

task cap {
    dependsOn assemble
    group "Build"
    description "Assembles a cap archive containing the main classes."

    doLast {
        ant.taskdef(name: 'javacard', classname: 'pro.javacard.ant.JavaCard', classpath: configurations.javacardAntTask.asPath)

        // 1PAY.SYS.DDF01
        ant.javacard(jckit: "oracle_javacard_sdks/${jc_sdk}") {
            cap (
                package: 'emvcardsimulator',
                version: '0.1',
                output: 'build/pse.cap',
                jca: 'build/pse.jca',
                export: 'build',
                classes: "build/classes/java/main",
                aid: '315041592E000000000000000000') {
                    applet (class: 'emvcardsimulator.PaymentSystemEnvironment', aid: '315041592E5359532E4444463031')
            }
        }

        // 2PAY.SYS.DDF01
        ant.javacard(jckit: "oracle_javacard_sdks/${jc_sdk}") {
            cap (
                package: 'emvcardsimulator',
                version: '0.1',
                output: 'build/ppse.cap',
                jca: 'build/ppse.jca',
                export: 'build',
                classes: "build/classes/java/main",
                aid: '325041592E000000000000000000') {
                    applet (class: 'emvcardsimulator.ProximityPaymentSystemEnvironment', aid: '325041592E5359532E4444463031')
            }
        }

        ant.javacard(jckit: "oracle_javacard_sdks/${jc_sdk}") {
            cap (
                package: 'emvcardsimulator',
                version: '0.1',
                output: 'build/paymentapp.cap',
                jca: 'build/paymentapp.jca',
                export: 'build',
                classes: "build/classes/java/main",
                aid: paymentapp_cap_aid) {
                    applet (class: 'emvcardsimulator.PaymentApplication', aid: paymentapp_applet_aid)
            }
        }
    }
}

// Shared setup of the tasks that talk to a card. The gp command line tool is not used, because it
// cannot connect to every card on every platform, see src/deploy/java CardDeployer.
// Finds a JDK that runs the selected gp.jar release: Java 8 for 20.07.04 and Java 17 or newer for
// the others, -Pdeploy_java_version overrides the choice. Called when a deploy task is run and not
// while the build is configured, so that an unrelated build never looks for a JDK it does not need.
def deployJavaLauncher() {
    List<String> versions = project.hasProperty("deploy_java_version")
            ? [deploy_java_version.toString()]
            : (gp_version == gp_java8_version ? ["8"] : ["17", "21", "25"])

    for (String version : versions) {
        try {
            return javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(Integer.parseInt(version))
            }.get()
        } catch (Exception ignored) {
            // No such JDK installed, try the next one
        }
    }

    throw new GradleException("No JDK ${versions.join(' or ')} found to run gp.jar ${gp_version}."
        + " Install one, or deploy with the release that runs on Java 8: -Pgp_version=${gp_java8_version}")
}

def configureDeploy(JavaExec task, String capFile) {
    task.dependsOn downloadGp
    task.group "JavaCard"
    task.classpath = sourceSets.deploy.output + files(gp_jar)
    task.mainClass = 'emvcardsimulator.deploy.CardDeployer'
    task.javaLauncher = providers.provider { deployJavaLauncher() }
    task.systemProperties = [
        // -Pdeploy_protocol=T=0 or T=1 pins the card protocol, by default they are probed
        'deploy.protocol': project.findProperty('deploy_protocol') ?: 'auto',
        // -Pdeploy_reader=<name part> selects the reader if several have a card
        'deploy.reader': project.findProperty('deploy_reader') ?: '',
        // -Pdeploy_lfdbh=SHA1 or SHA256 pins the load file data block hash, by default SHA-256 is
        // attempted first and SHA-1 is the fallback for cards that reject it
        'deploy.lfdbh': project.findProperty('deploy_lfdbh') ?: 'auto',
        // -Pdeploy_force=false keeps an already installed package instead of replacing it
        'deploy.force': project.findProperty('deploy_force') ?: 'true',
        // -Pdeploy_delete=<AID>,<AID> removes other packages first, e.g. an earlier applet AID
        'deploy.delete': project.findProperty('deploy_delete') ?: ''
    ]

    if (capFile != null) {
        task.dependsOn cap
        task.args capFile
    }
}

task deployCheck(type: JavaExec) {
    description "Check that the selected gp.jar works with the deployment, no card needed"
    configureDeploy(delegate, null)
    dependsOn cap
    args 'check', 'build/pse.cap', 'build/ppse.cap', 'build/paymentapp.cap'
}

task cardInfo(type: JavaExec) {
    description "Show the card contents without changing them"
    configureDeploy(delegate, null)
}

task deployPse(type: JavaExec) {
    description "Deploy PaymentSystemEnvironment applet to JavaCard"
    configureDeploy(delegate, 'build/pse.cap')
}

task deployPpse(type: JavaExec) {
    description "Deploy ProximityPaymentSystemEnvironment applet to JavaCard"
    configureDeploy(delegate, 'build/ppse.cap')
}

task deployPaymentApp(type: JavaExec) {
    description "Deploy payment application applet to JavaCard"
    configureDeploy(delegate, 'build/paymentapp.cap')
}
