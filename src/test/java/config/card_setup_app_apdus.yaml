# ICC Application Cryptogram Master Key MK_AC (double length 3DES). When set, Application Cryptogram (9F26)
# is generated with EMV Book 2 Common Session Key Derivation (A1.3.1) and ISO/IEC 9797-1 MAC Algorithm 3 (A1.2.1)
# over CDOL related data || AIP || ATC || Issuer Application Data (9F10) when the IAD flag is set, as in Visa Cryptogram Version
# Number 18 of the Issuer Application Data of this profile. Clear the key with empty data ('80 00 00 07 00') to use the static 9F26 tag value.
- req: '80 00 00 07 10 01 23 45 67 89 AB CD EF FE DC BA 98 76 54 32 10'
  res: '90 00'
# Flags: random, Issuer Application Data included in the Application Cryptogram (Cryptogram Version Number 18)
- req: '80 00 00 03 02 00 03'
  res: '90 00'
# ARPC method for issuer authentication (EMV Book 2, 8.2) in EXTERNAL AUTHENTICATE or tag 91 in CDOL2:
# '01' = Method 1, Issuer Authentication Data ARPC (8) || ARC (2)
# '02' = Method 2, Issuer Authentication Data ARPC (4) || CSU (4) || Proprietary Authentication Data (0-8)
# Second GENERATE AC returns AAC when issuer authentication has failed.
- req: '80 00 00 08 01 01'
  res: '90 00'
# ICC Secure Messaging for Integrity Master Key MK_SMI (double length 3DES) for issuer script commands.
# Secure messaging format 1 (CLA '8C' / '0C') with MAC chaining, EMV Book 2 9.2 and Annex D2, or format 2 (CLA '84' / '04') of the
# payment systems: data || 8-byte MAC over CLA INS P1 P2 Lc || ATC || Application Cryptogram || data.
- req: '80 00 00 09 10 89 AB CD EF 01 23 45 67 76 54 32 10 FE DC BA 98'
  res: '90 00'
# Relay Resistance Protocol timing '80 00 00 0A 06', see card_setup_app_mastercard_contactless_apdus.yaml
# Optional settings, see PaymentApplication.processSetSettings:
# Flags ('80 00 00 03 02 00 xx'), xx is a sum of: '01' random, '02' IAD in AC, '04' qVSDC (Application Cryptogram and fDDA in
# GET PROCESSING OPTIONS response, cryptogram type from Terminal Transaction Qualifiers 9F66 in PDOL), '08' card risk management.
# Card risk management uses Lower/Upper Consecutive Offline Limit tags 9F14/9F23, Offline Accumulator Balance 9F50 and
# cumulative offline amount limits: '80 00 00 0E 0C' || lower (6) || upper (6), n12 like 9F02, zero is no limit.
# Card Verification Results in Issuer Application Data 9F10: '80 00 00 0D 02' || format || offset,
# format '01' Common Core Definitions CVR (5 bytes), '02' Visa CVR ('03' + 3 bytes), e.g. '80 00 00 0D 02 02 03' for this profile,
# '03' Mastercard M/Chip CVR (6 bytes), e.g. '80 00 00 0D 02 03 02' in card_setup_app_mastercard_contactless_apdus.yaml.
# ICC PIN Encipherment key for enciphered offline PIN: modulus '80 00 00 0F', private exponent '80 00 00 10', empty modulus clears it.
# Mag-stripe mode COMPUTE CRYPTOGRAPHIC CHECKSUM: KD_CVC3 '80 00 00 0B 10' || key, IVCVC3 Track1 (2) || Track2 (2) '80 00 00 0C 04',
# UDOL tag 9F69 (default '9F 6A 04'), response template id 7 (default 9F61 9F60 9F36).
# PUT DATA writable tags (Data Storage, balance): '80 00 00 11' || tag list, e.g. '80 00 00 11 04 DF 61 9F 50'.
# RECOVER AC of a torn first GENERATE AC is supported when DRDOL tag 9F51 exists.
# Transaction log is written when Log Entry 9F4D (SFI, number of records) and Log Format 9F4F exist.
# Tags of three bytes are set with P1 P2 '00 00' and the tag before the value, e.g. '80 01 00 00 05 DF 81 01 AA BB'.
# Data objects in the value of a constructed tag, e.g. FCI Proprietary Template A5, are card data as well.
# Record as is: '80 04' || record number || SFI << 3 | 4 || Lc || '70' record template, its data objects are card data.
# Interface of the following tags and GET PROCESSING OPTIONS response template: '80 00 00 12 01' || '00' both (default),
# '01' contact or '02' contactless, an interface specific tag takes precedence over a tag of both interfaces.
# ICC private key as CRT components: p '80 00 00 13', q '80 00 00 14', d mod (p - 1) '80 00 00 15', d mod (q - 1) '80 00 00 16',
# q^-1 mod p '80 00 00 17'. PIN Try Limit (default 3): '80 00 00 18 01' || limit.
# Default templates: FCI 84 A5, GENERATE AC 9F27 9F36 9F26 9F10, INTERNAL AUTHENTICATE 9F4B. ATC starts from zero when 9F36 is not set.
