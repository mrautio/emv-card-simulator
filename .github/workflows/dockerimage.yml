name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: null

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          submodules: true
      - name: Build and test
        run: docker build -t emvcard-builder -f Dockerfile .
      - name: Copy JavaCard build
        run: docker run --rm emvcard-builder cat /tmp/javacard_build.tar.gz >
          javacard_build.tar.gz && tar xvzf javacard_build.tar.gz
      - name: Upload JavaCard build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        with:
          name: javacard_build
          path: 'javacard_build'
