# Visa contactless (EMV Contactless Book C-3, Kernel 3) profile: qVSDC online transaction with fDDA and no CVM.
# Applied after card_setup_app_apdus.yaml, only the differing data objects are set here.
- req: '00 A4 04 00 07 AF FF FF FF FF 12 34'
  res: '90 00'
# Flags: random, Issuer Application Data in the Application Cryptogram (Cryptogram Version Number 18),
# Application Cryptogram and fDDA in GET PROCESSING OPTIONS response (qVSDC)
- req: '80 00 00 03 02 00 07'
  res: '90 00'
# Visa Card Verification Results in Issuer Application Data 9F10
- req: '80 00 00 0D 02 02 03'
  res: '90 00'
# FCI Proprietary Template (A5) with the PDOL
- req: '80 02 00 05 0C 00 50 5F 2D 00 87 9F 12 9F 11 9F 38'
  res: '90 00'
# GET PROCESSING OPTIONS response template: AIP, AFL, Track 2, IAD, AC, CID, ATC, Signed Dynamic Application Data,
# Card Authentication Related Data and Card Transaction Qualifiers
- req: '80 02 00 01 14 00 82 00 94 00 57 9F 10 9F 26 9F 27 9F 36 9F 4B 9F 69 9F 6C'
  res: '90 00'
# Application Interchange Profile: DDA (fDDA) supported, no cardholder verification in the CVM List
- req: '80 01 00 82 02 20 00'
  res: '90 00'
# Application File Locator: Track 2 Equivalent Data is in the GET PROCESSING OPTIONS response, SFI 1 is not read.
# Static data to be authenticated is SFI 3 records 1-2.
- req: '80 01 00 94 08 10 01 03 00 18 01 02 02'
  res: '90 00'
# Cardholder name and Track 1 Discretionary Data are not available on the contactless interface, SFI 1 record 2 has only the Track 2
- req: '80 03 02 0C 02 00 57'
  res: '90 00'
# PDOL: Terminal Transaction Qualifiers followed by the CDOL1 data objects
- req: '80 01 9F 38 18 9F 66 04 9F 02 06 9F 03 06 9F 1A 02 95 05 5F 2A 02 9A 03 9C 01 9F 37 04'
  res: '90 00'
# Card Transaction Qualifiers: no online PIN or signature required, CVM is not required
- req: '80 01 9F 6C 02 00 00'
  res: '90 00'
# ICC Public Key Certificate signed with iin_313233343536_e_3_private_key.pem, static data to be authenticated is
# SFI 3 records 1-2 and the Application Interchange Profile (Static Data Authentication Tag List 9F4A)
- req: '80 01 9F 46 F8 0A BE CD AA 7E 3A 9D 9B AB 68 A5 59 2B 2B B7 6D 0F B6 E2 CA 0E B5 18 AF 05 F1 F8 6B 6B 20 E4 22 A6 80 6A E3 56 F6 4F 47 ED 5A 5E 01 C0 6B 7E 68 A0 A0 2C 3B B1 F5 A6 2B 1B 5B AB 28 FE C0 DE A2 56 0F 1A E2 E7 11 C4 79 BA 35 11 A9 47 32 76 51 E5 9D 63 4C 8B 1C 50 55 8C F2 B6 27 40 96 9B BE D1 20 AC 2A D3 21 47 3F ED 0D 51 BE F8 5E E3 3D AA 59 31 79 42 9F 75 3B 05 99 E1 6D D5 99 02 07 F5 9A B6 84 E6 B3 AB CB D5 DA CA A4 2B A2 75 B9 DB 17 0A EF A6 8D C9 1C 9E 1F AE 20 F2 0B 04 7C A7 77 29 81 B9 09 EC 35 4D 19 C4 5B 4B 31 B7 AB A7 8A F4 08 FC D0 8D FB D0 CD 76 29 F3 B3 03 C1 94 0A 82 89 C9 44 91 BF CA 4A 3E C9 12 80 64 77 3A C7 02 15 B1 14 FD E5 12 7A B0 18 BE 3D AB 51 4D B2 DF E7 08 AB A5 63 E9 B3 69 33 0B 22 DD 73 24 86 0A 86 24 A0 29 AD'
  res: '90 00'
