# Proximity Payment System Environment (EMV Contactless Book B, 3.3) of Mockstercard, a fake card scheme on top of Kernel 2
# Select PPSE AID 2PAY.SYS.DDF01
- req: '00 A4 04 00 0E 32 50 41 59 2E 53 59 53 2E 44 44 46 30 31'
  res: '90 00'
# "Factory reset"
- req: '80 05 00 00 00'
  res: '90 00'
# Setup tag templates: FCI (6F) = DF Name (84) || FCI Proprietary Template (A5), A5 = FCI Issuer Discretionary Data (BF0C).
# BF0C has no template, the stored tag with one or more Directory Entries (61) is returned as is.
- req: '80 02 00 04 04 00 84 00 A5'
  res: '90 00'
- req: '80 02 00 05 02 BF 0C'
  res: '90 00'
# Setup ICC EMV tags
- req: '80 01 00 84 0E 32 50 41 59 2E 53 59 53 2E 44 44 46 30 31'
  res: '90 00'
# Directory Entry: ADF Name (4F), Application Label (50) "MOCKSTERCARD", Application Priority Indicator (87), Kernel Identifier (9F2A) '02'
- req: '80 01 BF 0C 20 61 1E 4F 07 AF FF FF FF FF 12 34 50 0C 4D 4F 43 4B 53 54 45 52 43 41 52 44 87 01 01 9F 2A 01 02'
  res: '90 00'
